name: CI

# Campagne de test WASSALNI : rejoue la régression PHPUnit et l'API (Newman)
# sur une base MariaDB éphémère, à chaque push ou pull request.
on:
  push:
    branches: [main, "test/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  APP_DEBUG: "1"
  APP_SECRET: ci-only-secret-not-for-production
  # Doctrine ajoute le suffixe _test en environnement test : la base réelle est wassalni_test
  DATABASE_URL: "mysql://root:root@127.0.0.1:3306/wassalni?serverVersion=mariadb-10.4.32&charset=utf8mb4"
  MAILER_DSN: "null://null"
  MESSENGER_TRANSPORT_DSN: "in-memory://"
  # Mot de passe fictif propre à la CI (comptes de test uniquement)
  WASSALNI_TEST_PASSWORD: ci-only-Test-Passw0rd

jobs:
  tests:
    name: Régression PHPUnit (unitaire, intégration, fonctionnel)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_mysql, mbstring
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Créer le fichier .env attendu par Symfony
        # .env n'est pas versionné : sans lui, Symfony (Dotenv) plante dès composer install.
        # C'était la cause des échecs de toutes les exécutions précédentes.
        run: |
          test -f .env || printf 'APP_ENV=test\nDEFAULT_URI=http://localhost\n' > .env

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Contrôles statiques
        run: |
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php bin/console lint:container

      - name: Audit des dépendances (informatif)
        continue-on-error: true
        run: composer audit --no-interaction

      - name: Préparer la base wassalni_test
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - name: Régression PHPUnit (anomalies ouvertes exclues)
        run: |
          mkdir -p build/reports
          vendor/bin/phpunit --testdox \
            --log-junit build/reports/regression-junit.xml \
            --coverage-text --coverage-clover build/reports/clover.xml

      - name: Rejouer les anomalies ouvertes (échecs attendus, informatif)
        if: always()
        continue-on-error: true
        run: vendor/bin/phpunit --group anomalie-ouverte --log-junit build/reports/anomalies-junit.xml

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: build/reports/
          if-no-files-found: warn
